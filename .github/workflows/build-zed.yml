name: Build Zed

on:
  workflow_dispatch:
    inputs:
      zed_version:
        description: "Zed version (leave empty to detect latest)"
        required: false
        type: string

      build_version:
        description: "Debian package revision"
        required: true
        default: "1"
        type: string
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout zed-apt
        uses: actions/checkout@v6

      - name: Checkout zed-debian
        uses: actions/checkout@v6
        with:
          repository: RevoltNihility/zed-debian
          path: zed-debian

      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils

      - name: Detect Zed version
        id: detect_version
        env:
          MANUAL_VERSION: ${{ inputs.zed_version }}
        run: |
          set -euo pipefail

          if [ -n "$MANUAL_VERSION" ]; then
            VERSION="$MANUAL_VERSION"
            echo "Manual version requested: $VERSION"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            RESPONSE="$(curl -fsSL \
              https://api.github.com/repos/zed-industries/zed/releases/latest)"

            TAG="$(jq -r '.tag_name // empty' <<< "$RESPONSE")"
            if [ -z "$TAG" ]; then
              echo "ERROR: Could not detect the latest Zed release."
              exit 1
            fi

            VERSION="${TAG#v}"

            # Prefer the version recorded on the published GitHub Pages site.
            # Fall back to the version file in the checked-out repository.
            PUBLISHED_VERSION=""
            PUBLISHED_URL="https://RevoltNihility.github.io/zed-apt/latest-version.txt"

            PUBLISHED_VERSION="$(curl -fsSL "$PUBLISHED_URL" 2>/dev/null || true)"
            PUBLISHED_VERSION="$(printf '%s' "$PUBLISHED_VERSION" | tr -d '[:space:]')"

            if [ -z "$PUBLISHED_VERSION" ]; then
              if [ -f "$GITHUB_WORKSPACE/latest-version.txt" ]; then
                PUBLISHED_VERSION="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/latest-version.txt")"
              fi
            fi

            echo "Latest upstream version: $VERSION"
            echo "Last published version: ${PUBLISHED_VERSION:-none}"

            if [ "$VERSION" = "$PUBLISHED_VERSION" ]; then
              echo "No new Zed release; skipping build."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "New Zed version detected."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "zed_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Zed package
        if: steps.detect_version.outputs.should_build == 'true'
        working-directory: zed-debian
        env:
          ZED_VERSION: ${{ steps.detect_version.outputs.zed_version }}
          BUILD_VERSION: ${{ inputs.build_version || '1' }}
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh \
            "$ZED_VERSION" \
            "$BUILD_VERSION" \
            amd64

      
      - name: Prepare APT repository
        if: steps.detect_version.outputs.should_build == 'true'
        env:
          ZED_VERSION: ${{ steps.detect_version.outputs.zed_version }}
          BUILD_VERSION: ${{ inputs.build_version || '1' }}
        run: |
          set -e

          REPO="$GITHUB_WORKSPACE/apt-repo"

          mkdir -p \
            "$REPO/pool/main/z/zed" \
            "$REPO/dists/resolute/main/binary-amd64"

          DEB="$(find "$GITHUB_WORKSPACE" -type f \
            -name "zed_${ZED_VERSION}-${BUILD_VERSION}~resolute_amd64_ubu.deb" \
            | head -n 1)"

          if [ -z "$DEB" ]; then
            echo "ERROR: resolute amd64 package not found."
            echo "Expected: zed_${ZED_VERSION}-${BUILD_VERSION}~resolute_amd64_ubu.deb"
            find "$GITHUB_WORKSPACE" -type f -name '*.deb' -print
            exit 1
          fi

          echo "Using package:"
          echo "$DEB"

          cp "$DEB" "$REPO/pool/main/z/zed/"

          (
            cd "$REPO"
            apt-ftparchive packages pool \
              > dists/resolute/main/binary-amd64/Packages
          )

          gzip -9 -k \
            "$REPO/dists/resolute/main/binary-amd64/Packages"

          cat > "$RUNNER_TEMP/release.conf" <<'EOF'
          APT::FTPArchive::Release {
            Origin "Zed";
            Label "Zed APT Repository";
            Suite "resolute";
            Codename "resolute";
            Architectures "amd64";
            Components "main";
            Description "Zed APT repository";
          };
          EOF

          apt-ftparchive \
            -c "$RUNNER_TEMP/release.conf" \
            release "$REPO/dists/resolute" \
            > "$REPO/dists/resolute/Release"

          echo
          echo "=== APT repository ==="
          find "$REPO" -type f | sort

      - name: Publish repository key
        if: steps.detect_version.outputs.should_build == 'true'
        run: |
          cp zed-archive-keyring.asc apt-repo/zed-archive-keyring.asc

      - name: Import GPG signing key
        if: steps.detect_version.outputs.should_build == 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -e

          export GNUPGHOME="$RUNNER_TEMP/gnupg"

          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          printf '%s\n' "$APT_GPG_PRIVATE_KEY" \
            | gpg --batch --import

          echo "GPG key imported successfully."

          gpg --batch --list-secret-keys --keyid-format=long

      - name: Sign APT repository
        if: steps.detect_version.outputs.should_build == 'true'
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -e

          export GNUPGHOME="$RUNNER_TEMP/gnupg"

          cd apt-repo/dists/resolute

          echo "=== Creating InRelease ==="

          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "$APT_GPG_PASSPHRASE" \
            --clearsign \
            --output InRelease \
            Release

          echo "=== Creating Release.gpg ==="

          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "$APT_GPG_PASSPHRASE" \
            --armor \
            --detach-sign \
            --output Release.gpg \
            Release

          echo
          echo "=== Signed repository files ==="
          ls -lh Release InRelease Release.gpg

      - name: Verify APT signature
        if: steps.detect_version.outputs.should_build == 'true'
        run: |
          set -e

          GNUPGHOME="$RUNNER_TEMP/verify-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          gpg \
            --batch \
            --import \
            zed-archive-keyring.asc

          echo "=== Verify InRelease ==="

          gpg \
            --batch \
            --status-fd 1 \
            --verify \
            apt-repo/dists/resolute/InRelease

      - name: Inspect APT metadata
        if: steps.detect_version.outputs.should_build == 'true'
        run: |
          echo "=== Packages ==="
          cat apt-repo/dists/resolute/main/binary-amd64/Packages

          echo
          echo "=== Release ==="
          cat apt-repo/dists/resolute/Release

      - name: Setup GitHub Pages
        if: steps.detect_version.outputs.should_build == 'true'
        uses: actions/configure-pages@v5

      - name: Upload APT repository
        if: steps.detect_version.outputs.should_build == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apt-repo

      - name: Deploy to GitHub Pages
        if: steps.detect_version.outputs.should_build == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
