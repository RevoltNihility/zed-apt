name: Build Zed

on:
  workflow_dispatch:
    inputs:
      zed_version:
        description: "Zed version, e.g. 1.23.2"
        required: true
        type: string

      build_version:
        description: "Debian package revision"
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout zed-apt
        uses: actions/checkout@v6

      - name: Checkout zed-debian
        uses: actions/checkout@v6
        with:
          repository: RevoltNihility/zed-debian
          path: zed-debian

      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils

      - name: Build Zed package
        working-directory: zed-debian
        run: |
          chmod +x build.sh

          ./build.sh \
            "${{ inputs.zed_version }}" \
            "${{ inputs.build_version }}" \
            amd64

      - name: Create APT repository
        shell: bash
        run: |
          set -e

          REPO="$GITHUB_WORKSPACE/apt-repo"

          mkdir -p \
            "$REPO/pool/main/z/zed" \
            "$REPO/dists/resolute/main/binary-amd64"

          echo "=== Find generated .deb ==="
          find "$GITHUB_WORKSPACE" -type f -name '*.deb' -print

          DEB="$(find "$GITHUB_WORKSPACE" -type f \
            -name "zed_${{ inputs.zed_version }}-${{ inputs.build_version }}~resolute_amd64_ubu.deb" \
            | head -n 1)"

          if [ -z "$DEB" ]; then
            echo "ERROR: resolute amd64 package not found."
            echo "Available .deb files:"
            find "$GITHUB_WORKSPACE" -type f -name '*.deb' -print
            exit 1
          fi

          echo "Using package:"
          echo "$DEB"

          cp "$DEB" "$REPO/pool/main/z/zed/"
          echo
          echo "=== Generate Packages ==="

          (
            cd "$REPO"

            apt-ftparchive packages \
              pool \
              > dists/resolute/main/binary-amd64/Packages
          )

          gzip -9 -k \
            "$REPO/dists/resolute/main/binary-amd64/Packages"

          echo
          echo "=== Generate Release ==="

          apt-ftparchive release \
            "$REPO/dists/resolute" \
            > "$REPO/dists/resolute/Release"

          echo
          echo "=== APT repository ==="
          find "$REPO" -type f | sort

      - name: Publish repository key
        run: |
          cp zed-archive-keyring.asc apt-repo/zed-archive-keyring.asc

      - name: Import GPG signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -e

          export GNUPGHOME="$RUNNER_TEMP/gnupg"

          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          printf '%s\n' "$APT_GPG_PRIVATE_KEY" \
            | gpg --batch --import

          echo "GPG key imported successfully."

          gpg --batch --list-secret-keys --keyid-format=long

      - name: Sign APT repository
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -e

          export GNUPGHOME="$RUNNER_TEMP/gnupg"

          cd apt-repo/dists/resolute

          echo "=== Creating InRelease ==="

          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "$APT_GPG_PASSPHRASE" \
            --clearsign \
            --output InRelease \
            Release

          echo "=== Creating Release.gpg ==="

          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "$APT_GPG_PASSPHRASE" \
            --armor \
            --detach-sign \
            --output Release.gpg \
            Release

          echo
          echo "=== Signed repository files ==="
          ls -lh Release InRelease Release.gpg

      - name: Verify APT signature
        run: |
          set -e

          GNUPGHOME="$RUNNER_TEMP/verify-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          gpg \
            --batch \
            --import \
            zed-archive-keyring.asc

          echo "=== Verify InRelease ==="

          gpg \
            --batch \
            --status-fd 1 \
            --verify \
            apt-repo/dists/resolute/InRelease

      - name: Inspect APT metadata
        run: |
          echo "=== Packages ==="
          cat apt-repo/dists/resolute/main/binary-amd64/Packages

          echo
          echo "=== Release ==="
          cat apt-repo/dists/resolute/Release

                - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload APT repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apt-repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
