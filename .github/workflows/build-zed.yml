name: Build Zed

on:
  workflow_dispatch:
    inputs:
      zed_version:
        description: "Zed version, e.g. 1.23.2"
        required: true
        type: string

      build_version:
        description: "Debian package revision"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout zed-apt
        uses: actions/checkout@v6

      - name: Checkout zed-debian
        uses: actions/checkout@v6
        with:
          repository: RevoltNihility/zed-debian
          path: zed-debian

      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils

      - name: Build Zed package
        working-directory: zed-debian
        run: |
          chmod +x build.sh

          ./build.sh \
            "${{ inputs.zed_version }}" \
            "${{ inputs.build_version }}" \
            amd64

      - name: Create APT repository
        shell: bash
        run: |
          set -e

          REPO="$GITHUB_WORKSPACE/apt-repo"

          mkdir -p \
            "$REPO/pool/main/z/zed" \
            "$REPO/dists/resolute/main/binary-amd64"

          echo "=== Find generated .deb ==="
          find "$GITHUB_WORKSPACE" -type f -name '*.deb' -print

          DEB="$(find "$GITHUB_WORKSPACE" -type f -name '*.deb' | head -n 1)"

          if [ -z "$DEB" ]; then
            echo "ERROR: No .deb package found."
            exit 1
          fi

          echo "Using package:"
          echo "$DEB"

          cp "$DEB" "$REPO/pool/main/z/zed/"

          echo
          echo "=== Generate Packages ==="

          (
            cd "$REPO"

            apt-ftparchive packages \
              pool \
              > dists/resolute/main/binary-amd64/Packages
          )

          gzip -9 -k \
            "$REPO/dists/resolute/main/binary-amd64/Packages"

          echo
          echo "=== Generate Release ==="

          apt-ftparchive release \
            "$REPO/dists/resolute" \
            > "$REPO/dists/resolute/Release"

          echo
          echo "=== APT repository ==="
          find "$REPO" -type f | sort

      - name: Inspect APT metadata
        run: |
          echo "=== Packages ==="
          cat apt-repo/dists/resolute/main/binary-amd64/Packages

          echo
          echo "=== Release ==="
          cat apt-repo/dists/resolute/Release
